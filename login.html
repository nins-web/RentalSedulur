<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Rental Sedulur</title>
  <script>
    // Script Penjaga: Jika belum login, lempar kembali ke halaman login!
    if(localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; }
        .apple-input { background-color: rgba(0, 0, 0, 0.04); border: 1px solid transparent; transition: all 0.2s ease; }
        .apple-input:focus { background-color: #fff; border-color: #007aff; box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); outline: none; }
    </style>
</head>
<body class="h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-white rounded-[2rem] p-8 sm:p-10 shadow-[0_20px_40px_rgb(0,0,0,0.08)] border border-gray-100 text-center">
        <!-- Ikon / Logo -->
        <div class="w-16 h-16 bg-black rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        
        <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Portal Admin</h2>
        <p class="text-sm text-gray-500 mb-8">Silakan masukkan kredensial Anda.</p>

        <form id="loginForm" onsubmit="prosesLogin(event)" class="space-y-5 text-left">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input type="text" id="username" required class="apple-input w-full rounded-xl px-4 py-3 text-gray-900" placeholder="admin">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" id="password" required class="apple-input w-full rounded-xl px-4 py-3 text-gray-900" placeholder="••••••••">
            </div>
            
            <p id="error-msg" class="text-red-500 text-xs font-semibold hidden text-center">Username atau Password salah!</p>
            <button type="submit" class="w-full bg-black text-white font-bold py-4 rounded-xl shadow-md hover:bg-gray-800 transition-colors mt-4">
                Masuk ke Panel
            </button>
        </form>
        <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
    <span class="text-gray-500">Halo, Admin!</span>
    <button onclick="prosesLogout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full transition-colors">
        Keluar (Logout)
    </button>
</div>
        <p class="mt-6 text-xs text-gray-400">&copy; 2026 Rental Sedulur. Hak Cipta Dilindungi.</p>
    </div>

    <script>
        // Cek jika sudah login, langsung lempar ke admin
        if(localStorage.getItem("isLoggedIn") === "true") {
            window.location.href = "admin.html";
        }

        function prosesLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Simulasi Login (Hardcoded untuk prototype frontend)
            // Di sistem asli, ini akan mengecek ke database
            if(user === "admin" && pass === "rahasia123") {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "admin.html";
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
